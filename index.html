<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="portfolio-build" content="20261125-clear-backgrounds" />
    <meta name="description" content="杨增延的 AIGC 视觉设计作品集：原创音乐 MV、动画短剧、传统文化影像与商业广告作品。" />
    <title>Yang Zengyan - Visual / AI / Brand Designer</title>
    <style>
      body{margin:0;background:#090610;color:#f5efff;font-family:system-ui,"Microsoft YaHei",sans-serif}
      html.portfolio-loading{overflow:hidden}
      .hero-loader [hidden]{display:none!important}
      .hero-loader{position:fixed;z-index:2000;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(1.35rem,3vh,2.35rem);box-sizing:border-box;overflow:hidden;padding:max(clamp(1rem,3vw,2.5rem),env(safe-area-inset-top,0px)) max(clamp(1rem,3vw,2.5rem),env(safe-area-inset-right,0px)) max(clamp(1rem,3vw,2.5rem),env(safe-area-inset-bottom,0px)) max(clamp(1rem,3vw,2.5rem),env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 48%,#171022 0,#0b0715 38%,#05050c 78%);text-align:center;transform:scale(1);transition:opacity .55s ease,visibility .55s ease,transform .7s cubic-bezier(.22,1,.36,1)}.hero-loader span{display:block;min-width:3.7ch;max-width:100%;font-size:clamp(5rem,min(22vw,24vh),13rem);font-weight:500;font-variant-numeric:tabular-nums;line-height:.75;letter-spacing:-.075em;white-space:nowrap;color:#f3f1fb;text-shadow:0 0 44px rgba(183,137,255,.18);animation:heroLoaderBreath 1.2s ease-in-out infinite alternate}.hero-loader-rule{position:relative;width:clamp(12rem,28vw,24rem);max-width:72vw;height:2px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.14)}.hero-loader-rule::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#9d62ef,#e5caff 58%,#fff);box-shadow:0 0 16px rgba(190,132,255,.72);transform:scaleX(var(--loader-progress,0));transform-origin:left center;transition:transform .16s linear}.hero-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.055)}@keyframes heroLoaderBreath{from{opacity:.82;filter:blur(0)}to{opacity:1;filter:drop-shadow(0 0 12px rgba(201,151,255,.25))}}@media(max-width:30rem),(max-height:32rem){.hero-loader{gap:1.15rem}.hero-loader span{font-size:clamp(4.6rem,min(25vw,23vh),8rem);line-height:.78}.hero-loader-rule{width:clamp(10rem,52vw,16rem);max-width:70vw}}@media(prefers-reduced-motion:reduce){.hero-loader span{animation:none}.hero-loader,.hero-loader-rule::after{transition-duration:.01ms}}
      .hero-loader p{max-width:28rem;margin:0;color:#eee5ff;font-size:1rem;line-height:1.7}
      .hero-loader button{padding:.75rem 1.4rem;border:1px solid #c7a4f8;border-radius:999px;background:#26173d;color:#fff;font:inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="opening-loader" class="hero-loader" role="status" aria-label="正在加载作品集" style="--loader-progress:0">
      <span id="opening-count" aria-hidden="true">0%</span>
      <div id="opening-rule" class="hero-loader-rule" aria-hidden="true"></div>
      <p id="opening-message" hidden>页面加载失败，请重新加载以打开完整作品集。</p>
      <button id="opening-retry" type="button" hidden>重新加载</button>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script data-opening-bootstrap>
      (() => {
        const loader = document.getElementById('opening-loader');
        const count = document.getElementById('opening-count');
        const root = document.getElementById('root');
        const message = document.getElementById('opening-message');
        const retry = document.getElementById('opening-retry');
        const completed = new Set();
        let tasks = [], finalize, total = 0;
        let started = false, running = false, finished = false, finishing = false, fatal = false;
        let exitTimer, removeTimer;
        document.documentElement.classList.add('portfolio-loading');
        const draw = () => {
          const value = total ? Math.floor(completed.size / total * 100) : 0;
          count.textContent = value + '%';
          loader.style.setProperty('--loader-progress', value / 100);
          if (started) {
            message.hidden = false;
            message.textContent = '正在准备清晰封面与背景动画 · ' + completed.size + ' / ' + total;
          }
        };
        const showError = () => {
          message.hidden = false;
          message.textContent = fatal ? '页面加载失败，请重新加载。' : '部分内容尚未加载成功，请重试后继续。';
          retry.textContent = fatal ? '重新加载' : '重试未完成内容';
          retry.hidden = false;
          loader.setAttribute('role', 'alert');
          loader.setAttribute('aria-label', '作品集尚未加载完成');
        };
        const fail = () => {
          if (finished) return;
          fatal = true;
          [exitTimer, removeTimer].forEach(clearTimeout);
          showError();
        };
        const finish = () => {
          if (finishing || finished || fatal) return;
          finishing = true;
          exitTimer = setTimeout(() => {
            if (fatal) return;
            finished = true;
            loader.classList.add('is-hidden');
            loader.setAttribute('aria-hidden', 'true');
            root.removeAttribute('inert');
            root.removeAttribute('aria-hidden');
            document.documentElement.classList.remove('portfolio-loading');
            document.dispatchEvent(new Event('portfolio-opening-finished'));
            removeTimer = setTimeout(() => loader.remove(), 600);
          }, 80);
        };
        const run = async () => {
          if (running || finished || finishing || fatal) return;
          running = true;
          retry.hidden = true;
          loader.setAttribute('role', 'status');
          loader.setAttribute('aria-label', '正在加载作品集');
          draw();
          const pending = tasks.filter(task => !completed.has(task.id));
          let cursor = 0, errors = 0;
          await Promise.all(Array.from({ length: Math.min(4, pending.length) }, async () => {
            while (cursor < pending.length && !fatal) {
              const task = pending[cursor++];
              try {
                await task.run();
                if (!fatal) { completed.add(task.id); draw(); }
              } catch { errors += 1; }
            }
          }));
          if (!fatal && errors === 0) {
            try {
              await finalize();
              if (!fatal) { completed.add('__display_ready__'); draw(); finish(); }
            } catch { errors += 1; }
          }
          running = false;
          if (!fatal && errors > 0) showError();
        };
        retry.addEventListener('click', () => {
          if (!started || fatal) location.reload();
          else run();
        });
        window.__portfolioOpening = {
          start(resources, prepareDisplay) {
            if (started || fatal || finished) return;
            started = true;
            if (!Array.isArray(resources) || resources.some(task => !task.id || typeof task.run !== 'function') || typeof prepareDisplay !== 'function') { fail(); return; }
            tasks = [...new Map(resources.map(task => [task.id, task])).values()];
            finalize = prepareDisplay;
            total = tasks.length + 1;
            run();
          },
          fail,
          isFinished: () => finished,
        };
        draw();
      })();
    </script>
    <noscript><style>#opening-loader{display:none}</style><p>请启用 JavaScript 后查看完整作品集。</p></noscript>
    <script>
      var connection = navigator.connection;
      if (connection && (connection.saveData || /(^|-)2g$|3g/.test(connection.effectiveType || ''))) {
        document.documentElement.dataset.connectionMode = 'lite';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
